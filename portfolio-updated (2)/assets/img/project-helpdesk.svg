  </defs>
  <rect width="640" height="400" fill="url(#bgDesk)"/>

  <!-- desk -->
  <rect x="90" y="290" width="460" height="18" rx="4" fill="rgba(255,255,255,0.35)"/>
  <rect x="120" y="308" width="16" height="60" fill="rgba(255,255,255,0.25)"/>
  <rect x="500" y="308" width="16" height="60" fill="rgba(255,255,255,0.25)"/>

  <!-- monitor -->
