<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgPune" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2f6feb"/>
      <stop offset="100%" stop-color="#8b6ad6"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bgPune)"/>

  <!-- sun -->
  <circle cx="500" cy="90" r="42" fill="#ffe27a" opacity="0.9"/>

  <!-- city skyline -->
  <g fill="rgba(255,255,255,0.18)">
    <rect x="40" y="230" width="60" height="140"/>
    <rect x="110" y="190" width="50" height="180"/>
    <rect x="170" y="250" width="45" height="120"/>
  </g>
  <g fill="rgba(255,255,255,0.28)">
    <rect x="210" y="210" width="55" height="160"/>
    <rect x="275" y="170" width="48" height="200"/>
    <rect x="333" y="240" width="50" height="130"/>
  </g>
  <!-- windows -->
  <g fill="rgba(255,255,255,0.5)">
    <rect x="225" y="230" width="8" height="10"/>
    <rect x="245" y="230" width="8" height="10"/>
    <rect x="225" y="255" width="8" height="10"/>
    <rect x="245" y="255" width="8" height="10"/>
    <rect x="290" y="195" width="8" height="10"/>
    <rect x="308" y="195" width="8" height="10"/>
    <rect x="290" y="220" width="8" height="10"/>
    <rect x="308" y="220" width="8" height="10"/>
  </g>

  <!-- ground -->
  <rect x="0" y="370" width="640" height="30" fill="rgba(0,0,0,0.12)"/>

  <!-- location pin -->
  <g transform="translate(430,150)">
    <path d="M0 0 C -45 0 -70 35 -70 72 C -70 118 0 190 0 190 C 0 190 70 118 70 72 C 70 35 45 0 0 0 Z" fill="#ffffff"/>
    <circle cx="0" cy="70" r="28" fill="#2f6feb"/>
  </g>
</svg>
