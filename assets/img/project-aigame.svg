<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f3fb0"/>
      <stop offset="100%" stop-color="#7a4fe0"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bgGame)"/>

  <!-- VS text glow circles -->
  <circle cx="180" cy="200" r="90" fill="rgba(255,255,255,0.08)"/>
  <circle cx="460" cy="200" r="90" fill="rgba(255,255,255,0.08)"/>

  <!-- player controller icon -->
  <g transform="translate(180,200)">
    <rect x="-55" y="-25" width="110" height="55" rx="27" fill="#ffffff"/>
    <rect x="-30" y="-10" width="9" height="26" fill="#3455d1"/>
    <rect x="-42" y="2" width="33" height="9" fill="#3455d1"/>
    <circle cx="20" cy="-4" r="7" fill="#3455d1"/>
    <circle cx="36" cy="10" r="7" fill="#3455d1"/>
  </g>

  <!-- AI robot icon -->
  <g transform="translate(460,200)">
    <rect x="-40" y="-40" width="80" height="60" rx="14" fill="#ffffff"/>
    <circle cx="-16" cy="-12" r="7" fill="#7a4fe0"/>
    <circle cx="16" cy="-12" r="7" fill="#7a4fe0"/>
    <rect x="-18" y="8" width="36" height="7" rx="3" fill="#7a4fe0"/>
    <rect x="-5" y="-58" width="10" height="18" fill="#ffffff"/>
    <circle cx="0" cy="-62" r="7" fill="#7ef0c2"/>
    <rect x="-56" y="-22" width="14" height="30" rx="6" fill="#ffffff"/>
    <rect x="42" y="-22" width="14" height="30" rx="6" fill="#ffffff"/>
  </g>

  <!-- VS badge -->
  <g transform="translate(320,200)">
    <circle r="34" fill="#ffe27a"/>
    <text x="0" y="10" font-family="Poppins, sans-serif" font-size="28" font-weight="700" fill="#1f3fb0" text-anchor="middle">VS</text>
  </g>

  <!-- sparks -->
  <g fill="#ffe27a">
    <circle cx="320" cy="120" r="5"/>
    <circle cx="290" cy="290" r="4"/>
    <circle cx="350" cy="290" r="4"/>
  </g>
</svg>
