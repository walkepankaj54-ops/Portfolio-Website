<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c4fd6"/>
      <stop offset="100%" stop-color="#6b46c1"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bgFace)"/>

  <!-- face outline -->
  <g transform="translate(320,205)">
    <ellipse cx="0" cy="0" rx="95" ry="115" fill="rgba(255,255,255,0.14)"/>
    <circle cx="-35" cy="-15" r="9" fill="#ffffff"/>
    <circle cx="35" cy="-15" r="9" fill="#ffffff"/>
    <path d="M -30 45 Q 0 70 30 45" stroke="#ffffff" stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>

  <!-- scan corner brackets -->
  <g stroke="#7ef0c2" stroke-width="8" fill="none" stroke-linecap="round">
    <path d="M180 90 h-40 v40"/>
    <path d="M460 90 h40 v40"/>
    <path d="M180 320 h-40 v-40"/>
    <path d="M460 320 h40 v-40"/>
  </g>

  <!-- scan line -->
  <rect x="160" y="200" width="320" height="6" fill="#7ef0c2" opacity="0.85"/>

  <!-- checkmark badge -->
  <g transform="translate(430,300)">
    <circle r="34" fill="#22c58b"/>
    <path d="M-14 0 L-4 12 L16 -14" stroke="#ffffff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
